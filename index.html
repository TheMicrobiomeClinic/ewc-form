<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Express Written Consult — The Microbiome Clinic™</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<style>
/* Design shared with the Pre-Consult form (Paper file "Pre-Consult Form"). */
:root{
  --ink:#17181C;
  --muted:#6B7280;
  --label:#8A8A90;
  --body:#374151;
  --hair:#E5E7EB;
  --hair-2:#D1D5DB;
  --surf:#F7F7F8;
  --blue:#316A9C;
  --tint:rgba(49,106,156,.06);
  --hl:rgba(49,106,156,.14);
  --ph:#9CA3AF;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:var(--sans);background:#fff;color:var(--ink);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-wrap:anywhere}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--blue)}
.mono{font-family:var(--mono);font-size:11px;line-height:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--label)}

/* ---------- layout: 640 photo | panel ---------- */
.shell{display:flex;min-height:100vh;min-height:100dvh}
.photo{flex:0 0 min(640px,44.5vw);height:100vh;height:100dvh;position:sticky;top:0;overflow:hidden;background:#2b3a44}
.ph-layer{position:absolute;inset:0;background-size:cover;background-position:50%;opacity:0;transition:opacity .4s ease}
.ph-layer.on{opacity:1}
.ph-layer::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%)}
.ph-cap{position:absolute;left:40px;right:40px;bottom:40px;max-width:400px;display:flex;flex-direction:column;gap:6px;color:#fff;z-index:2}
.ph-cap .mono{color:#fff;opacity:.85}
.ph-cap p{font-size:15px;line-height:22px}
.ph-cap>*{transition:opacity .2s ease}

.panel{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;background:#fff}
.bar{height:3px;background:var(--hair);flex:none;overflow:hidden}
.bar i{display:block;height:3px;background:var(--blue);transform-origin:0 50%;transform:scaleX(0);transition:transform .4s ease-out}
.bar.hide{visibility:hidden}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:28px 64px 0}
.wordmark{width:186px;height:14px;flex:none;background:url(assets/wordmark-ink.png) 50%/contain no-repeat}
.meta{text-align:right;display:flex;flex-direction:column;gap:4px}
.meta .help{font-size:14px;line-height:18px;color:var(--muted)}

.stage{flex:1 1 auto;display:flex;flex-direction:column;padding:32px 64px}
.step{margin:auto 0;width:100%;max-width:672px;display:flex;flex-direction:column;gap:32px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 64px 36px;background:#fff;position:sticky;bottom:0;z-index:10}
.foot.hide{display:none}

.btn-back{font-size:15px;line-height:18px;color:var(--muted);text-decoration:underline 1px;text-underline-position:from-font;padding:8px 0}
.btn-back.hidden{visibility:hidden}
.btn-next,.btn-cta,.btn-ghost{height:52px;padding:0 32px;border-radius:999px;background:var(--ink);color:#fff;font-size:15px;font-weight:500;line-height:18px;
  display:inline-flex;align-items:center;justify-content:center;transition:background-color .15s ease,color .15s ease,border-color .15s ease;flex:none}
.btn-cta{padding:0 40px;align-self:flex-start}
.btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--hair-2);align-self:flex-start}
.btn-ghost:hover{border-color:var(--ink)}
.btn-next:disabled{background:var(--hair);color:var(--ph);cursor:not-allowed}
.btn-plain{font-size:15px;color:var(--muted);text-decoration:underline 1px;text-underline-position:from-font;padding:10px 0;align-self:flex-start}
.btn-row{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}

/* ---------- headings ---------- */
.q-head{display:flex;flex-direction:column;gap:12px}
.q-head h1{font-size:44px;line-height:52px;font-weight:600;letter-spacing:-.02em}
.hl{background:var(--hl);border-radius:4px;padding:0 8px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.q-head .sub{font-size:16px;line-height:24px;color:var(--muted)}
.optional-tag{color:var(--ph)}
.hero{display:flex;flex-direction:column;gap:32px;align-items:flex-start}
.hero-txt{display:flex;flex-direction:column;gap:16px}
.eyebrow{display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:6px;height:6px;background:var(--blue);flex:none}
.hero h1{font-size:52px;line-height:60px;font-weight:600;letter-spacing:-.03em;max-width:620px}
.hero h1 .hl{padding:0 10px}
.hero .sub{font-size:17px;line-height:26px;color:var(--muted);max-width:520px}
.hero .sub b{color:var(--ink);font-weight:600}
.hero-foot{display:flex;flex-wrap:wrap;gap:12px 28px;padding:0 64px 36px}
.hero-foot[hidden],[hidden]{display:none!important}
.mini-note{font-size:14px;line-height:20px;color:var(--muted);max-width:560px}

/* ---------- options ---------- */
.opts{display:flex;flex-direction:column}
.opt{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;padding:12px 16px;
  border-bottom:1px solid var(--hair);border-radius:0;cursor:pointer;user-select:none;text-align:left;width:100%;
  font-size:20px;line-height:24px;font-weight:500;transition:background-color .12s ease,border-radius .12s ease}
.opts .opt:first-child{border-top:1px solid var(--hair)}
.opts.dense .opt{min-height:54px;font-size:19px}
.opts.long .opt{min-height:54px;font-size:16px;line-height:24px;font-weight:400;padding:14px 16px}
.opt:hover{background:rgba(49,106,156,.03)}
.opt.selected{background:var(--tint);border-radius:8px}
.dot,.tick{flex:none;width:22px;height:22px;position:relative;display:flex;align-items:center;justify-content:center}
.dot{border-radius:11px;border:1.5px solid var(--hair)}
.dot::after{content:"";position:absolute;inset:-1.5px;border-radius:11px;background:var(--blue);transform:scale(.6);opacity:0;transition:transform .14s ease-out,opacity .14s ease-out}
.opt.selected .dot::after{transform:scale(1);opacity:1}
.tick{border-radius:5px;border:1.5px solid var(--hair-2);transition:background-color .12s ease,border-color .12s ease}
.tick svg{opacity:0;transform:scale(.6);transition:transform .14s ease-out,opacity .14s ease-out}
.selected>.tick{background:var(--blue);border-color:var(--blue)}
.selected>.tick svg{opacity:1;transform:none}
.check-row{display:flex;align-items:flex-start;gap:12px;cursor:pointer;user-select:none;font-size:16px;line-height:24px;text-align:left}
.check-row .tick{margin-top:1px}

/* ---------- inputs ---------- */
.field{display:flex;flex-direction:column;gap:8px}
.fields{display:flex;flex-direction:column;gap:22px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.line{width:100%;height:52px;border:0;border-bottom:1.5px solid var(--hair);border-radius:0;background:transparent;outline:none;
  font:inherit;font-size:19px;line-height:24px;color:var(--ink);transition:border-color .15s ease;-webkit-appearance:none;appearance:none}
.line:focus{border-bottom-color:var(--ink)}
::placeholder{color:var(--ph);opacity:1}
.box{width:100%;min-height:180px;padding:18px 20px;border:1px solid var(--hair);border-radius:12px;background:var(--surf);outline:none;resize:vertical;
  font:inherit;font-size:18px;line-height:28px;color:var(--ink);transition:border-color .15s ease,background-color .15s ease}
.box:focus{border-color:var(--ink);background:#fff}
.box.short{min-height:110px}
.box.q{min-height:84px}
.hint{font-size:14px;line-height:20px;color:var(--muted)}
.add-link{font-size:15px;line-height:18px;font-weight:500;color:var(--blue);cursor:pointer;align-self:flex-start;padding:4px 0}
.c-new{opacity:0;transform:translateY(-6px)}
.c-new.in{opacity:1;transform:none;transition:opacity .22s var(--ease),transform .22s var(--ease)}

/* expanding conditional block (height + fade, 220ms) */
.expand{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .22s var(--ease),opacity .22s var(--ease)}
.expand>div{overflow:hidden;min-height:0}
.expand.open{grid-template-rows:1fr;opacity:1}

/* ---------- info boxes ---------- */
.note{background:var(--surf);border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:8px}
.note>b{font-size:16px;line-height:22px;font-weight:600}
.note p{font-size:15px;line-height:24px;color:var(--body)}
.note .mono{color:var(--blue)}
.note.stop{background:#FDF0EC}
.note.stop>b{color:#B42318}
.urgent{padding:13px 15px;border-radius:12px;background:rgba(255,181,108,.16);font-size:14.5px;line-height:1.45;color:var(--ink)}
.hero .note{max-width:560px}

/* ---------- bot check ---------- */
.ts{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.ts-box{min-height:65px}
.gate-hint{color:var(--blue)}
.gate-hint:empty{display:none}

/* ---------- loading ---------- */
.load-list{display:flex;flex-direction:column;gap:14px}
.load-item{display:flex;align-items:center;gap:12px;font-size:16px;line-height:22px;opacity:.4;transition:opacity .3s ease}
.load-item .ring{width:20px;height:20px;border-radius:10px;border:1.5px solid var(--hair);flex:none;display:flex;align-items:center;justify-content:center}
.load-item.active,.load-item.done{opacity:1}
.load-item.active .ring{border:2px solid var(--blue);border-right-color:var(--hair);animation:spin .8s linear infinite}
.load-item.done .ring{border:0;background:var(--blue);animation:none}
.load-item .ring svg{display:none}
.load-item.done .ring svg{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- done / already sent ---------- */
.done-card{width:100%;max-width:560px;padding:24px;border:1px solid var(--hair);border-radius:16px;display:flex;flex-direction:column;gap:14px}
.done-card .mono{color:var(--blue)}
.done-card h3{font-size:20px;line-height:26px;font-weight:600}
.done-card p{font-size:15px;line-height:23px;color:var(--muted)}
.recap{display:flex;flex-direction:column}
.recap-item{display:grid;grid-template-columns:160px 1fr;gap:16px;padding:10px 0;border-bottom:1px solid #F0F0F2}
.recap-item:last-child{border-bottom:0}
.recap-item .k{font-size:14px;line-height:20px;color:var(--muted)}
.recap-item .v{font-size:15px;line-height:22px;white-space:pre-wrap}

/* autofill detection (details step) */
@keyframes onAutoFillStart{from{opacity:.99}to{opacity:1}}
input:-webkit-autofill{animation-name:onAutoFillStart;animation-duration:.01s}
input:autofill{animation-name:onAutoFillStart;animation-duration:.01s}

/* ---------- mobile: 150px photo strip, sticky Back/Continue ---------- */
.strip{display:none}
@media (max-width:1023px){
  .shell{display:block}
  .photo{display:none}
  .strip{display:flex;position:relative;height:150px;flex:none;flex-direction:column;justify-content:space-between;padding:16px 20px 14px;overflow:hidden;color:#fff;background:#2b3a44}
  .strip .ph-layer::after{background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,.5) 100%)}
  .strip-top,.strip-cap{position:relative;z-index:2}
  .strip-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .strip .wm{width:150px;height:11px;background:url(assets/wordmark-white.png) 50%/contain no-repeat;flex:none}
  .strip .mono{color:#fff;font-size:10px;text-align:right}
  .strip-cap{font-size:13px;line-height:18px;transition:opacity .2s ease}
  .head{display:none}
  .panel{min-height:100dvh}
  .stage{padding:28px 20px 24px}
  .step{margin:0;gap:20px}
  .q-head{gap:8px}
  .q-head h1{font-size:28px;line-height:34px}
  .q-head .sub{font-size:15px;line-height:22px}
  .q-head .hl{background:none;padding:0}
  .hero{gap:24px}
  .hero h1{font-size:36px;line-height:42px}
  .hero .sub{font-size:16px;line-height:24px}
  .hero-foot{padding:0 20px 28px}
  .opt{min-height:52px;font-size:17px;line-height:22px;padding:10px 12px}
  .opts.dense .opt{min-height:52px;font-size:17px}
  .opts.long .opt{font-size:15px;line-height:22px;padding:12px}
  .dot,.tick{width:20px;height:20px}
  .foot{position:sticky;bottom:0;z-index:10;border-top:1px solid #F0F0F2;padding:14px 20px calc(14px + env(safe-area-inset-bottom))}
  .btn-next{height:50px;padding:0 36px}
  .row2{grid-template-columns:1fr;gap:22px}
  .box{font-size:17px;line-height:26px;min-height:150px}
  .box.short{min-height:110px}
  .box.q{min-height:84px}
  .line{font-size:18px}
  .recap-item{grid-template-columns:1fr;gap:2px}
  .done-card{padding:20px}
}
@media (max-width:1023px) and (min-width:600px){ .stage,.hero-foot,.foot{padding-left:40px;padding-right:40px} }
@media (prefers-reduced-motion:reduce){
  .ph-layer,.ph-cap>*,.strip-cap{transition:opacity .12s linear}
  .bar i{transition:none}
  .dot::after,.tick svg{transition:opacity .12s linear;transform:none!important}
  .expand{transition:opacity .12s linear}
  .c-new{transform:none}.c-new.in{transition:opacity .12s linear}
  .load-item.active .ring{animation:none}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="photo" aria-hidden="true">
    <div class="ph-layer"></div><div class="ph-layer"></div>
    <div class="ph-cap"><div class="mono" id="phLbl"></div><p id="phTxt"></p></div>
  </aside>

  <main class="panel">
    <div class="strip" aria-hidden="true">
      <div class="ph-layer"></div><div class="ph-layer"></div>
      <div class="strip-top"><div class="wm"></div><div class="mono" id="stripCount"></div></div>
      <div class="strip-cap" id="stripCap"></div>
    </div>
    <div class="bar" id="bar"><i id="barFill"></i></div>
    <div class="head">
      <div class="wordmark" role="img" aria-label="The Microbiome Clinic"></div>
      <div class="meta" id="meta"></div>
    </div>
    <div class="stage" id="stage"></div>
    <div class="hero-foot" id="heroFoot" hidden>
      <span class="mono">Private &amp; confidential</span><span class="mono">Just for your doctor's response</span><span class="mono">No account needed</span>
    </div>
    <div class="foot" id="foot">
      <button class="btn-back" id="btnBack" type="button">Back</button>
      <button class="btn-next" id="btnNext" type="button" disabled>Continue</button>
    </div>
  </main>
</div>

<script>
/* ============ state ============ */
const answers = {};
let cur = 'welcome';
let history = [];          // step ids, for Back
let busy = false;
let renderToken = 0;

// Bump NOTICE_VERSION whenever the privacy notice or tick-box wording changes. It is sent
// with the answers as the record of exactly which wording the patient agreed to.
const NOTICE_VERSION = "ewc-2026-10-v1";
const PRIVACY_URL = "https://themicrobiomeclinic.com.au/pages/privacy-policy";
const PRIVACY_LINK = `<a href="${PRIVACY_URL}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Privacy Policy</a>`;
const PHOTO = id => 'assets/p-' + id + '.jpg';
const TICK = '<svg width="12" height="10" viewBox="0 0 12 10" aria-hidden="true"><path d="M1 5l3.5 3.5L11 1" fill="none" stroke="#fff" stroke-width="2"/></svg>';

/* ============ returning patients: token, saved draft, sent record ============
   Everything here stays in the patient's own browser. Nothing they type is sent
   anywhere until they consent and submit. The token is the only part that also
   reaches us, and only on a successful submit, so the clinic can tell that two
   consults came from the same browser. It is random and identifies nobody. */
const TOKEN_KEY='ewc_token_v1', DRAFT_KEY='ewc_draft_v1', SENT_KEY='ewc_sent_v1';
const DRAFT_TTL_DAYS=14;   // unfinished answers are discarded after two weeks
const SENT_TTL_DAYS=60;    // the "you already sent one" notice stops after two months

// Drafts saved by the previous version of this form store stepIdx/history as
// indexes into this array. Used only to map those old drafts onto step ids.
const OLD_FLOW = ['welcome','e_emergency','e_doctor','e_payment','e_before','e_today','e_positive','e_negative','e_adherence','e_adherence_detail','transition','e_questions','e_extras','acknowledge','consent','details','loading','done','already_sent'];

// Private windows, locked-down browsers and blocked cookies all throw here. The
// form has to keep working in that case — it just can't offer to restore anything.
function store(){ try{ const s=window.localStorage; s.getItem(TOKEN_KEY); return s; }catch(e){ return null; } }
function readJSON(k){ const s=store(); if(!s) return null; try{ return JSON.parse(s.getItem(k)||'null'); }catch(e){ return null; } }
function writeJSON(k,v){ const s=store(); if(!s) return; try{ s.setItem(k,JSON.stringify(v)); }catch(e){} }
function dropKey(k){ const s=store(); if(!s) return; try{ s.removeItem(k); }catch(e){} }

function newToken(){
  try{ if(crypto&&crypto.randomUUID) return crypto.randomUUID().replace(/-/g,''); }catch(e){}
  try{ const a=new Uint8Array(16); crypto.getRandomValues(a);
       return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join(''); }catch(e){}
  return (Date.now().toString(36)+Math.random().toString(36).slice(2)).slice(0,32);
}
const draftToken=(function(){
  const s=store(); if(!s) return newToken();            // no storage: fresh each visit
  let t=null; try{ t=s.getItem(TOKEN_KEY); }catch(e){}
  if(!t||!/^[a-zA-Z0-9_-]{8,64}$/.test(t)){ t=newToken(); try{ s.setItem(TOKEN_KEY,t); }catch(e){} }
  return t;
})();

const daysSince=ms=>(Date.now()-ms)/86400000;
function fmtWhen(ms){
  try{ return new Date(ms).toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'}); }
  catch(e){ return 'earlier'; }
}

function loadDraft(){
  const d=readJSON(DRAFT_KEY);
  if(!d||!d.savedAt||!d.answers) return null;
  if(daysSince(d.savedAt)>DRAFT_TTL_DAYS){ dropKey(DRAFT_KEY); return null; }
  return d;
}
let draftTimer=null;
function scheduleDraftSave(){ clearTimeout(draftTimer); draftTimer=setTimeout(saveDraft,400); }
function saveDraft(){
  if(sentRecord) return;
  if(cur==='resume'||cur==='loading'||cur==='done'||cur==='already_sent') return;
  if(!Object.keys(answers).length) return;              // nothing typed yet
  writeJSON(DRAFT_KEY,{v:2,savedAt:Date.now(),cur,stepIdx:OLD_FLOW.indexOf(cur),history:history.slice(),answers});
}
function clearDraft(){ clearTimeout(draftTimer); dropKey(DRAFT_KEY); }

function loadSent(){
  const r=readJSON(SENT_KEY);
  if(!r||!r.sentAt) return null;
  if(daysSince(r.sentAt)>SENT_TTL_DAYS){ dropKey(SENT_KEY); return null; }
  return r;
}
let sentRecord=loadSent();
let pendingResume=null;

function wipeAnswers(){ Object.keys(answers).forEach(k=>delete answers[k]); history=[]; }
function resetSubmit(){ submitState={ sending:false, done:false, error:null, result:null }; turnstileToken=null; }

/* old drafts: numbers are indexes into OLD_FLOW; new drafts: step ids */
const toId = v => typeof v==='number' ? OLD_FLOW[v] : v;
function resumeDraft(){
  if(!pendingResume) return;
  const d=pendingResume;
  Object.assign(answers,d.answers||{});
  // A tick given before this notice existed (or under older wording) doesn't count: ask again.
  if(!answers.privacy_consent || answers.privacy_consent.notice!==NOTICE_VERSION){ delete answers.consent; delete answers.privacy_consent; }
  history=(d.history||[]).map(toId).filter(id=>steps[id] && !['resume','loading','done','already_sent'].includes(id));
  let to = typeof d.cur==='string' ? d.cur : toId(typeof d.stepIdx==='number'?d.stepIdx:0);
  // Never resume straight into 'loading' — that would fire a submit on arrival.
  if(!steps[to]||to==='resume'||to==='loading'||to==='done'||to==='already_sent') to='details';
  if(!visible(to)) to = history.length ? history.pop() : 'welcome';
  pendingResume=null; go(to,1,false);
}
function startFresh(){ pendingResume=null; clearDraft(); wipeAnswers(); go('welcome',-1,false); }
function startNewConsult(){
  dropKey(SENT_KEY); sentRecord=null; clearDraft(); wipeAnswers(); resetSubmit(); go('welcome',1,false);
}
function forgetMyAnswers(){
  clearDraft(); dropKey(SENT_KEY); sentRecord=null; pendingResume=null;
  wipeAnswers(); resetSubmit(); go('welcome',-1,false);
}

const RECAP_FIELDS=[
  ['Your doctor','doctor'],['Before treatment','feeling_before'],['How you feel today','feeling_today'],
  ['Positive changes','positive_changes'],['Negative changes','negative_changes'],
  ['Following the plan','adherence'],['More on that','adherence_detail'],
  ['Question 1','q1'],['Question 2','q2'],['Question 3','q3'],['Question 4','q4'],['Question 5','q5'],
  ['Anything else','anything_else']
];
const VALUE_LABELS={
  paul_froomes:'Dr Paul Froomes', juliet_froomes:'Dr Juliet Froomes', lisa_laidlaw:'Dr Lisa Laidlaw',
  vidya_prabhu:'Dr Vidya Prabhu', joanna_hickey:'Dr Joanna Hickey', grant_burns:'Dr Grant Burns',
  followed_closely:"I've followed it closely", most_with_gaps:"I've followed most of it, with some gaps",
  some_parts:"I've followed parts of it", struggled:"I've struggled to follow it", other:'Other'
};
function recapHTML(a){
  const rows=RECAP_FIELDS.map(([label,key])=>{
    const raw=a[key]; if(!raw||!String(raw).trim()) return '';
    return `<div class="recap-item"><div class="k">${label}</div><div class="v">${esc(VALUE_LABELS[raw]||String(raw))}</div></div>`;
  }).join('');
  return rows?`<div class="recap">${rows}</div>`:'<p class="mini-note">Your answers are no longer stored on this device.</p>';
}

/* ============ markup helpers ============ */
function esc(v){return (v==null?"":String(v)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
function nonEmpty(v){return !!(v!=null&&String(v).trim().length>0)}
function kbClick(e,el){ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); el.click(); } }
function qHead(h,sub){ return `<div class="q-head"><h1>${h[0]} <span class="hl">${h[1]}</span></h1>${sub?`<p class="sub">${sub}</p>`:''}</div>`; }
function hero(eyebrow,h,sub,extra){
  return `<div class="hero"><div class="hero-txt">${eyebrow?`<div class="eyebrow mono">${eyebrow}</div>`:''}
    <h1>${h[0]}${h[1]?` <span class="hl">${h[1]}</span>`:''}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div>${extra||''}</div>`;
}
function thanks(){ const f=(answers.name||'').trim().split(' ')[0]; return f ? ['Thank you,', esc(f)+'.'] : ['Thank you.','']; }
function radios(key,items,dense){
  return `<div class="opts ${dense?'dense':''}" role="radiogroup">`+items.map(([v,l])=>
    `<button type="button" class="opt ${answers[key]===v?'selected':''}" role="radio" aria-checked="${answers[key]===v}" onclick="pickRadio('${key}','${v}',this)"><span>${l}</span><span class="dot"></span></button>`).join('')+`</div>`;
}
function checks(key,items){
  answers[key]=answers[key]||[];
  return `<div class="opts long">`+items.map(([v,l])=>
    `<button type="button" class="opt ${answers[key].includes(v)?'selected':''}" role="checkbox" aria-checked="${answers[key].includes(v)}" onclick="toggleCheck('${key}','${v}',this)"><span>${l}</span><span class="tick">${TICK}</span></button>`).join('')+`</div>`;
}
function checkRow(key,text){
  return `<div class="check-row ${answers[key]?'selected':''}" role="checkbox" tabindex="0" aria-checked="${!!answers[key]}" onclick="toggleBool('${key}',this)" onkeydown="kbClick(event,this)"><span class="tick">${TICK}</span><span>${text}</span></div>`;
}
function textarea(key,ph,cls){
  return `<textarea class="box ${cls||''}" placeholder="${esc(ph)}" oninput="answers.${key}=this.value;check()">${esc(answers[key])}</textarea>`;
}

/* ---- interactions: tapping only selects. Nothing auto-advances. ---- */
function setSel(el,on){ el.classList.toggle('selected',on); if(el.hasAttribute('aria-checked')) el.setAttribute('aria-checked',on); }
function pickRadio(key,val,el){
  answers[key]=val; el.parentElement.querySelectorAll('.opt').forEach(o=>setSel(o,o===el));
  if(key==='payment_status'){ const x=document.getElementById('payStop'); if(x) x.classList.toggle('open',val==='not_complete'); }
  check();
}
function toggleCheck(key,val,el){ const a=answers[key]=answers[key]||[]; const i=a.indexOf(val); i>=0?a.splice(i,1):a.push(val); setSel(el,i<0); check(); }
function toggleBool(key,el){
  answers[key]=!answers[key]; setSel(el,answers[key]);
  if(key==='consent'){
    if(answers.consent) answers.privacy_consent={agreed:true,at:new Date().toISOString(),notice:NOTICE_VERSION};
    else delete answers.privacy_consent;
  }
  check();
}
function addQuestion(){
  if(!(answers._qShown<5)) return;
  answers._qShown++;
  const y=window.scrollY; paint(); window.scrollTo(0,y);
  const f=document.querySelector(`.field[data-q="${answers._qShown}"]`);
  if(f){ f.classList.add('c-new'); requestAnimationFrame(()=>requestAnimationFrame(()=>f.classList.add('in'))); const t=f.querySelector('textarea'); if(t) t.focus({preventScroll:true}); }
}

/* ============ details step: trust the DOM, not just input events ============
   Safari AutoFill can fill these boxes without firing an `input` event, so the
   step re-reads its values off the DOM: on change/blur, on the autofill
   animation, and on a short poll while the step is on screen. */
const DETAIL_FIELDS = [['fName','name'],['fEmail','email'],['fMobile','mobile']];
let detailsWatchTimer = null;
function syncDetailsFromDom(){
  let changed=false;
  for(const [id,key] of DETAIL_FIELDS){
    const el=document.getElementById(id); if(!el) continue;
    const v=el.value==null?'':el.value;
    if((answers[key]==null?'':answers[key])!==v){ answers[key]=v; changed=true; }
  }
  return changed;
}
function startDetailsWatch(){
  stopDetailsWatch();
  const step=stage.querySelector('.step'); if(!step) return;
  const pull=()=>{ syncDetailsFromDom(); check(); };
  ['change','blur','focusout'].forEach(ev=>step.addEventListener(ev,pull,true));
  step.addEventListener('animationstart',e=>{ if(e.animationName==='onAutoFillStart') pull(); },true);
  detailsWatchTimer=setInterval(()=>{ if(cur!=='details'){ stopDetailsWatch(); return; } if(syncDetailsFromDom()) check(); },400);
}
function stopDetailsWatch(){ if(detailsWatchTimer){ clearInterval(detailsWatchTimer); detailsWatchTimer=null; } }

/* ============ Turnstile (bot check) ============ */
const TURNSTILE_SITE_KEY = "0x4AAAAAAEAbihqlASLuDAFR";
let turnstileToken = null;
let turnstileWidgetId = null;
function mountTurnstile(){
  const box = document.getElementById('turnstileBox');
  if(!box || box.childElementCount) return;
  if(!window.turnstile){ setTimeout(mountTurnstile, 300); return; }
  if(turnstileWidgetId!==null){ try{ window.turnstile.remove(turnstileWidgetId); }catch(e){} turnstileWidgetId=null; }
  turnstileToken = null;
  turnstileWidgetId = window.turnstile.render(box, {
    sitekey: TURNSTILE_SITE_KEY,
    action: 'ewc',
    callback: (t)=>{ turnstileToken = t; check(); },
    'expired-callback': ()=>{ turnstileToken = null; check(); },
    'error-callback': ()=>{ turnstileToken = null; check(); }
  });
  check();
}

function buildPayload(){
  const acks = answers.acks || [];
  return {
    full_name: answers.name || '',
    email: answers.email || '',
    phone: answers.mobile || '',
    doctor: answers.doctor || null,
    payment_status: answers.payment_status || null,

    feeling_today: answers.feeling_today || null,
    positive_changes: answers.positive_changes || null,
    negative_changes: answers.negative_changes || null,
    adherence: answers.adherence || null,
    adherence_detail: answers.adherence_detail || null,

    question_1: answers.q1 || null,
    question_2: answers.q2 || null,
    question_3: answers.q3 || null,
    question_4: answers.q4 || null,
    question_5: answers.q5 || null,

    anything_else: answers.anything_else || null,

    ack_not_urgent: acks.includes('not_urgent'),
    ack_turnaround: acks.includes('turnaround'),
    ack_single_submission: acks.includes('single'),
    ack_prescription_discretion: acks.includes('prescription'),

    consent_given: answers.consent === true,
    privacy_consent: answers.privacy_consent || null,
    disclaimer_accepted: true,
    consent_version: NOTICE_VERSION,
    disclaimer_version: 'v1',
    turnstile_token: turnstileToken,
    draft_token: draftToken,
    website: ''
  };
}

const SUBMIT_TIMEOUT_MS = 30000;
const LOAD_TICK_MS = 700;
let loadTicker = null;
function startLoadTicks(){
  clearInterval(loadTicker);
  const items=[...document.querySelectorAll('#loadList .load-item')]; let i=0;
  const paintTicks=()=>items.forEach((el,j)=>{ el.classList.toggle('done',j<i); el.classList.toggle('active',j===i); });
  paintTicks();
  loadTicker=setInterval(()=>{ i=Math.min(i+1,items.length-1); paintTicks(); if(i===items.length-1) clearInterval(loadTicker); },LOAD_TICK_MS);
}

async function submitForm(){
  if(submitState.sending || submitState.done) return;
  submitState.sending = true; submitState.error = null;
  const started = Date.now();
  const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const killer = ctrl ? setTimeout(()=>ctrl.abort(), SUBMIT_TIMEOUT_MS) : null;
  try{
    const opts = { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(buildPayload()) };
    if(ctrl) opts.signal = ctrl.signal;
    const res = await fetch(ENDPOINT, opts);
    const data = await res.json().catch(()=>({}));
    if(!res.ok || !data.ok){
      const err = new Error(data.error || ('HTTP '+res.status));
      if(res.status === 429) err.kind = 'ratelimit';
      else if(/^Bot check/.test(data.error||'')) err.kind = 'botcheck';
      else err.kind = 'server';
      throw err;
    }
    submitState.result = data;
    submitState.done = true;
    // Keep a local record so a return visit shows what was sent, and clear the draft.
    sentRecord = { sentAt: Date.now(), shortId: data.short_id || null, answers: JSON.parse(JSON.stringify(answers)) };
    writeJSON(SENT_KEY, sentRecord);
    clearDraft();
  }catch(err){
    if(err && err.name === 'AbortError') err.kind = 'timeout';
    else if(err && !err.kind) err.kind = 'network';
    console.error('submit failed', err && err.kind, err);
    submitState.error = err;
  }finally{
    if(killer) clearTimeout(killer);
    submitState.sending = false;
    // the list ticks one item every 700ms; the next screen follows the last tick
    const wait = Math.max(0, LOAD_TICK_MS*3 + 300 - (Date.now()-started));
    setTimeout(()=>{
      if(cur !== 'loading') return;
      clearInterval(loadTicker);
      document.querySelectorAll('#loadList .load-item').forEach(el=>{ el.classList.remove('active'); el.classList.add('done'); });
      setTimeout(()=>{ if(cur!=='loading') return; if(submitState.done){ next(); return; } renderSubmitError(submitState.error); }, 450);
    }, wait);
  }
}
function renderSubmitError(err){
  const kind = (err && err.kind) || 'network';
  let title = "We couldn't send your answers";
  let body  = "Your responses are still here — nothing is lost. Please check your connection and try again.";
  let action = `<button class="btn-cta" onclick="retrySubmit()">Try again</button>`;
  if(kind === 'timeout'){ title = "That's taking longer than it should"; body = "Your answers are still here. This is usually a patchy connection — please try again, ideally on Wi-Fi."; }
  else if(kind === 'ratelimit'){ title = "This form has been submitted a few times already"; body = "So we don't double up your answers, please call the clinic on 03 9007 2630 and we'll check what we've received."; action=''; }
  else if(kind === 'botcheck'){ body = "Your responses are still here — nothing is lost. The \"Verify you are human\" check needs to be done again."; action = `<button class="btn-cta" onclick="redoBotCheck()">Go back to the check</button>`; }
  stage.innerHTML = `<div class="step">${hero('Not sent yet',[esc(title),''],esc(body),
    `<div style="display:flex;flex-direction:column;gap:12px;align-items:flex-start">${action}
     <p class="mini-note">Still not working? Call us on 03 9007 2630 and we'll take your answers over the phone.</p></div>`)}</div>`;
  foot.classList.add('hide');
}
function retrySubmit(){ submitState.sending=false; submitState.done=false; submitState.error=null; render(0); }
function redoBotCheck(){ submitState.sending=false; submitState.error=null; turnstileToken=null; turnstileWidgetId=null; go('consent',-1,false); }

/* ============ engine ============ */
const stage=document.getElementById('stage'), foot=document.getElementById('foot');
const btnNext=document.getElementById('btnNext'), btnBack=document.getElementById('btnBack');
const REDUCED=window.matchMedia('(prefers-reduced-motion: reduce)');
const photoSets=[...document.querySelectorAll('.photo, .strip')].map(el=>({layers:el.querySelectorAll('.ph-layer'),on:0,src:''}));

function setPhoto(id){
  const src=PHOTO(id);
  photoSets.forEach(p=>{
    if(p.src===src) return;
    const nxt=p.layers[1-p.on]; nxt.style.backgroundImage=`url(${src})`;
    nxt.classList.add('on'); p.layers[p.on].classList.remove('on'); p.on=1-p.on; p.src=src;
  });
}
function fadeText(el,html){
  if(el.innerHTML===html) return;
  if(REDUCED.matches||!el.innerHTML){ el.innerHTML=html; return; }
  el.style.opacity=0; setTimeout(()=>{ el.innerHTML=html; el.style.opacity=1; },200);
}
function chrome(){
  const st=steps[cur];
  setPhoto(st.photo||'h');
  const [lbl,txt]=st.cap||['Did you know?',factNow];
  fadeText(document.getElementById('phLbl'),esc(lbl)); fadeText(document.getElementById('phTxt'),esc(txt));
  const c=counted(), pos=c.indexOf(cur);
  const label = pos>=0 ? `Step ${pos+1} of ${c.length}` : '';
  document.getElementById('meta').innerHTML = st.hero
    ? `<div class="help">Need help? 03 9007 2630</div>`
    : `<div class="mono">${label}</div>`;
  document.getElementById('stripCount').textContent = st.hero ? '' : label;
  fadeText(document.getElementById('stripCap'), esc(txt));
  document.getElementById('bar').classList.toggle('hide', !!st.hero);
  let frac;
  if(pos>=0) frac=(pos+1)/c.length;
  else { const vf=visibleFlow(), i=vf.indexOf(cur); frac=i<0?0:vf.slice(0,i).filter(id=>!steps[id].hero).length/c.length; }
  document.getElementById('barFill').style.transform=`scaleX(${Math.min(1,frac)})`;
  document.getElementById('heroFoot').hidden = cur!=='welcome';
}
function paint(){
  stopDetailsWatch();
  const st=steps[cur];
  stage.innerHTML=`<div class="step">${st.render()}</div>`;
  foot.classList.toggle('hide', !!st.hero);
  btnBack.classList.toggle('hidden', !history.length);
  btnNext.textContent = 'Continue';
  chrome();
  if(typeof st.onRender==='function') st.onRender();
  check();
}
/* dir: 1 forward, -1 back, 0 none. Out = fade + lift 8px (180ms); in = fade + settle from 12px (260ms). Back reverses.
   busy is cleared the moment the screen swaps (not when the in-animation ends), so
   navigation can't lock up in throttled background tabs. */
function render(dir){
  const old=stage.querySelector('.step');
  const d=dir>=0?1:-1, rm=REDUCED.matches, token=++renderToken;
  let ran=false;
  const doIn=()=>{
    if(ran || token!==renderToken) return;   // already ran, or a newer render took over
    ran=true; busy=false;
    paint(); window.scrollTo(0,0);
    const el=stage.querySelector('.step');
    if(el && dir!==0 && el.animate)
      el.animate(rm?[{opacity:0},{opacity:1}]:[{opacity:0,transform:`translateY(${12*d}px)`},{opacity:1,transform:'none'}],
        {duration:rm?120:260,easing:'cubic-bezier(.2,.7,.2,1)'});
  };
  if(old && dir!==0 && old.animate){
    busy=true;
    const a=old.animate(rm?[{opacity:1},{opacity:0}]:[{opacity:1,transform:'none'},{opacity:0,transform:`translateY(${-8*d}px)`}],
      {duration:rm?120:180,easing:'ease-in',fill:'forwards'});
    a.onfinish=doIn; setTimeout(doIn,450);
  } else { busy=true; doIn(); }
}
function go(id,dir,pushHistory){
  if(pushHistory) history.push(cur);
  if(id!==cur) factNow = facts[factIdx++ % facts.length];
  cur=id; render(dir); scheduleDraftSave();
}
function check(){
  const st=steps[cur];
  if(cur==='details') syncDetailsFromDom();
  btnNext.disabled = st.valid ? !st.valid() : false;
  // Say why Continue is greyed out, so nobody is left staring at a dead button.
  const gh=document.getElementById('gateHint');
  if(gh){
    const needConsent=answers.consent!==true, needBot=!turnstileToken;
    gh.textContent = (!needConsent&&!needBot) ? ''
      : (needConsent&&needBot) ? 'Tick the consent box above, then complete the "Verify you are human" check.'
      : needConsent ? 'Tick the consent box above to continue.'
      : 'Complete the "Verify you are human" check above to continue.';
  }
  scheduleDraftSave();
}
function next(){
  if(busy) return;
  const vf=visibleFlow(); const i=vf.indexOf(cur);
  if(i<0||i>=vf.length-1) return;
  go(vf[i+1],1,true);
}
function back(){
  if(busy) return;
  if(!history.length) return;
  let prev=history.pop();
  while(history.length && !visible(prev)) prev=history.pop();
  factNow = facts[factIdx++ % facts.length];
  cur=prev; render(-1); scheduleDraftSave();
}
btnNext.addEventListener('click',()=>{
  if(cur==='details'){ syncDetailsFromDom(); check(); }
  if(btnNext.disabled) return;
  next();
});
btnBack.addEventListener('click',back);

/* iOS Safari pins sticky/fixed bars to the layout viewport, so the keyboard
   can hide Continue. Follow the visual viewport. */
(function trackKeyboard(){
  const vv=window.visualViewport; if(!vv) return;
  const apply=()=>{
    if(window.innerWidth>1023){ foot.style.transform=''; return; }
    const overlap=Math.max(0, window.innerHeight-(vv.height+vv.offsetTop));
    foot.style.transform = overlap>40 ? 'translateY(-'+overlap+'px)' : '';
  };
  vv.addEventListener('resize',apply); vv.addEventListener('scroll',apply); apply();
})();

// Save whatever is typed if the tab is closed or backgrounded mid-answer.
window.addEventListener('pagehide',saveDraft);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') saveDraft(); });

/* preload photos so the crossfade never flashes */
['a','b','c','d','e','f','g','h','i','j'].forEach(id=>{ const im=new Image(); im.src=PHOTO(id); });

(function boot(){
  if(sentRecord){ cur='already_sent'; render(0); return; }
  pendingResume=loadDraft();
  cur = pendingResume ? 'resume' : 'welcome';
  render(0);
})();
</script>
</body>
</html>
